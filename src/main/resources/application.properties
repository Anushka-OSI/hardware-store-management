spring.application.name=hardwarestoremanagement

# ===== MySQL (MySQL Workbench -> root/root) =====
spring.datasource.url=jdbc:mysql://localhost:3306/HardwareStoreManagement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== File uploads (product photos) =====
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Server =====
server.port=8080
server.servlet.session.timeout=60m
server.error.include-message=always