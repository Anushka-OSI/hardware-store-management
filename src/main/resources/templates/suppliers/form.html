<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Supplier Form')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: appNav}"></nav>

<main class="max-w-2xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-6" th:text="${supplierForm.id() != null ? 'Edit Supplier' : 'Add Supplier'}">Supplier Form</h1>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="bg-white shadow rounded-xl p-6">
        <form th:action="${supplierForm.id() != null ? '/suppliers/update' : '/suppliers/save'}"
              method="post" class="space-y-4">
            <input type="hidden" name="id" th:value="${supplierForm.id()}">

            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Business Name *</label>
                    <input type="text" name="businessName" th:value="${supplierForm.businessName()}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Representative / Contact Person</label>
                    <input type="text" name="contactPerson" th:value="${supplierForm.contactPerson()}"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Address</label>
                <input type="text" name="address" th:value="${supplierForm.address()}"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>

            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Login Username *</label>
                    <input type="text" name="username" th:value="${supplierForm.username()}" required
                           th:readonly="${supplierForm.id() != null}" th:classappend="${supplierForm.id() != null} ? 'bg-slate-100' : ''"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">
                        Login Password <span th:text="${supplierForm.id() != null ? '(blank = keep current)' : '*'}" class="text-xs text-slate-400"></span>
                    </label>
                    <input type="password" name="password" th:required="${supplierForm.id() == null}"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
                    <input type="email" name="email" th:value="${supplierForm.email()}"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Phone</label>
                    <input type="text" name="phone" th:value="${supplierForm.phone()}"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div>
                <label class="flex items-center gap-2 text-sm text-slate-600">
                    <input type="hidden" name="active" value="false">
                    <input type="checkbox" name="active" value="true" th:checked="${supplierForm.active()}" class="w-4 h-4 text-amber-500">
                    Account active (can login)
                </label>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-6 py-2 rounded-lg">
                    Save Supplier
                </button>
                <a th:href="@{/suppliers}" class="text-slate-500 px-4 py-2">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
