<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Purchase History')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: appNav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="max-w-5xl mx-auto px-4 py-6">
    <div class="mb-6">
        <a th:href="@{/suppliers}" class="text-sm text-amber-600 hover:underline">&larr; Back to suppliers</a>
        <h1 class="text-2xl font-bold text-slate-800 mt-1" th:text="${supplier.businessName != null ? supplier.businessName : supplier.fullName}">Supplier</h1>
        <p class="text-slate-500 text-sm">Purchase order history for this supplier.</p>
    </div>

    <div class="bg-white shadow rounded-xl overflow-hidden">
        <table class="min-w-full text-sm">
            <thead>
            <tr class="text-left text-slate-500 border-b bg-slate-50">
                <th class="py-3 px-4">PO #</th>
                <th class="py-3 px-4">Created</th>
                <th class="py-3 px-4">Expected</th>
                <th class="py-3 px-4">Total</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 text-right"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="po : ${orders}" class="border-b border-slate-100 hover:bg-slate-50">
                <td class="py-3 px-4 font-mono font-semibold text-amber-600" th:text="${po.poNumber}">PO</td>
                <td class="py-3 px-4" th:text="${#temporals.format(po.orderDate, 'yyyy-MM-dd')}">date</td>
                <td class="py-3 px-4" th:text="${po.expectedDeliveryDate != null ? #temporals.format(po.expectedDeliveryDate, 'yyyy-MM-dd') : 'N/A'}">exp</td>
                <td class="py-3 px-4">LKR <span th:text="${#numbers.formatDecimal(po.totalCost, 1, 2)}">0.00</span></td>
                <td class="py-3 px-4">
                    <span th:text="${po.status}" th:classappend="${po.status.name() == 'RECEIVED'} ? 'bg-green-100 text-green-800' : (${po.status.name() == 'CANCELLED'} ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800')"
                          class="px-2 py-0.5 rounded-full text-xs font-semibold">Status</span>
                </td>
                <td class="py-3 px-4 text-right">
                    <a th:href="@{/purchase-orders/{id}(id=${po.id})}" class="text-amber-600 hover:underline text-xs font-semibold">View &rarr;</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}"><td colspan="6" class="py-4 px-4 text-slate-400 text-center">No purchase orders for this supplier yet.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
