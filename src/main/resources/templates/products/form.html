<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Product Form')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: appNav}"></nav>

<main class="max-w-3xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-6" th:text="${productForm.id() != null ? 'Edit Product' : 'Add Product'}">Product Form</h1>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="bg-white shadow rounded-xl p-6">
        <form th:action="${productForm.id() != null ? '/products/update' : '/products/save'}"
              method="post" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="id" th:value="${productForm.id()}">

            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">SKU *</label>
                    <input type="text" name="sku" th:value="${productForm.sku()}" required
                           th:readonly="${productForm.id() != null}" th:classappend="${productForm.id() != null} ? 'bg-slate-100' : ''"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Product Name *</label>
                    <input type="text" name="name" th:value="${productForm.name()}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Brand</label>
                    <input type="text" name="brand" th:value="${productForm.brand()}"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Category</label>
                    <input type="text" name="category" th:value="${productForm.category()}"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
                <textarea name="description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg"
                          th:text="${productForm.description()}"></textarea>
            </div>

            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Selling Price (LKR) *</label>
                    <input type="number" step="0.01" min="0" name="price" th:value="${productForm.price()}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Preferred Supplier</label>
                    <select name="supplierId" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                        <option value="">-- No supplier --</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}"
                                th:text="${s.businessName != null ? s.businessName : s.fullName}"
                                th:selected="${productForm.supplierId() != null && productForm.supplierId() == s.id}">Supplier</option>
                    </select>
                </div>
            </div>

            <div class="bg-slate-50 rounded-xl p-4">
                <h3 class="font-semibold text-slate-700 text-sm mb-3">Stock Levels</h3>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Quantity In Stock</label>
                        <input type="number" min="0" name="quantityInStock" th:value="${productForm.quantityInStock()}"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Minimum Stock Level</label>
                        <input type="number" min="0" name="minStockLevel" th:value="${productForm.minStockLevel()}"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    </div>
                </div>
                <p class="text-xs text-slate-400 mt-2">When stock falls to or below the minimum, a low-stock warning is shown. Products with 0 stock are marked "Out of Stock" automatically.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Product Photo</label>
                <input type="file" name="photo" accept="image/*"
                       class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-amber-100 file:text-amber-700 file:font-semibold hover:file:bg-amber-200">
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-6 py-2 rounded-lg">
                    Save Product
                </button>
                <a th:href="@{/products}" class="text-slate-500 px-4 py-2">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
