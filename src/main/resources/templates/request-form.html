<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Submit Request')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: publicNav}"></nav>

<main class="max-w-xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Customer Request / Issue Form</h1>
    <p class="text-slate-500 mb-6">Tell us what you need - we will respond. No login required.</p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="bg-white shadow rounded-xl p-6">
        <form th:action="@{/request/submit}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Your Name *</label>
                <input type="text" name="customerName" th:value="${requestForm != null ? requestForm.customerName() : ''}" required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Telephone Number *</label>
                <input type="text" name="customerPhone" th:value="${requestForm != null ? requestForm.customerPhone() : ''}" required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Your Request / Message *</label>
                <textarea name="message" rows="5" required
                          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
                          th:text="${requestForm != null ? requestForm.message() : ''}"></textarea>
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold py-2.5 rounded-lg transition">
                Submit Request
            </button>
        </form>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/request/status}" class="text-sm text-amber-600 hover:underline">Already submitted? Check the status of your request &rarr;</a>
    </div>
</main>
</body>
</html>
