<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Request Detail')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: appNav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="max-w-3xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <a th:href="@{/requests}" class="text-sm text-amber-600 hover:underline">&larr; Back to requests</a>
            <h1 class="text-2xl font-bold text-slate-800 mt-1" th:text="${request.requestId}">REQ</h1>
        </div>
        <span th:text="${request.status}" th:classappend="${request.status.name() == 'RESOLVED' || request.status.name() == 'CLOSED'} ? 'bg-green-100 text-green-800' : (${request.status.name() == 'IN_PROGRESS'} ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800')"
              class="px-3 py-1 rounded-full text-xs font-bold uppercase">Status</span>
    </div>

    <div class="bg-white shadow rounded-xl p-6 mb-6">
        <div class="grid sm:grid-cols-2 gap-4 mb-4">
            <div>
                <div class="text-xs text-slate-500 uppercase">Customer</div>
                <div class="text-slate-800 font-medium" th:text="${request.customerName}">Name</div>
            </div>
            <div>
                <div class="text-xs text-slate-500 uppercase">Telephone</div>
                <div class="text-slate-800 font-medium" th:text="${request.customerPhone}">Phone</div>
            </div>
        </div>
        <div class="mb-4">
            <div class="text-xs text-slate-500 uppercase">Submitted</div>
            <div class="text-slate-800" th:text="${#temporals.format(request.createdAt, 'yyyy-MM-dd HH:mm')}">date</div>
        </div>
        <div>
            <div class="text-xs text-slate-500 uppercase mb-1">Message</div>
            <p class="text-slate-700 bg-slate-50 rounded-lg p-4 whitespace-pre-wrap" th:text="${request.message}">message</p>
        </div>
    </div>

    <!-- Admin response so far -->
    <div class="bg-white shadow rounded-xl p-6 mb-6">
        <h2 class="font-semibold text-slate-700 mb-2">Current Admin Response</h2>
        <p th:if="${request.adminResponse != null && !request.adminResponse.isBlank()}"
           class="text-slate-700 bg-green-50 border border-green-200 rounded-lg p-4" th:text="${request.adminResponse}">response</p>
        <p th:unless="${request.adminResponse != null && !request.adminResponse.isBlank()}"
           class="text-slate-400 italic bg-slate-50 rounded-lg p-4">No response added yet.</p>
    </div>

    <!-- Update status + response -->
    <div class="bg-white shadow rounded-xl p-6">
        <h2 class="font-semibold text-slate-700 mb-4">Update Request</h2>
        <form th:action="@{/requests/{id}/update(id=${request.id})}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Status</label>
                <select name="status" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    <option th:each="s : ${allStatus}" th:value="${s}" th:text="${s}" th:selected="${request.status == s}">Status</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Add / Update Response Message</label>
                <textarea name="response" rows="4" class="w-full px-3 py-2 border border-slate-300 rounded-lg"
                          placeholder="Write a response for the customer..."></textarea>
            </div>
            <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-6 py-2 rounded-lg">
                Save Status &amp; Response
            </button>
        </form>
    </div>
</main>
</body>
</html>
