<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('New Purchase Order')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: appNav}"></nav>

<main class="max-w-4xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Create Purchase Order</h1>
    <p class="text-slate-500 mb-6 text-sm">Select a supplier, add products with quantities and unit costs.</p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/purchase-orders/save}" method="post" class="space-y-6"
          x-data="poForm()" @submit="beforeSubmit()">
        <div class="bg-white shadow rounded-xl p-6 space-y-4">
            <div class="grid sm:grid-cols-3 gap-4">
                <div class="sm:col-span-1">
                    <label class="block text-sm font-medium text-slate-600 mb-1">Supplier *</label>
                    <select name="supplierId" required class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                        <option value="">-- Select supplier --</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}"
                                th:text="${s.businessName != null ? s.businessName : s.fullName}">Supplier</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Order Date</label>
<input type="date" name="orderDate" th:value="${today}"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Expected Delivery</label>
                    <input type="date" name="expectedDeliveryDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Notes</label>
                <input type="text" name="notes" class="w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="Optional notes about this order">
            </div>
        </div>

        <!-- Line items -->
        <div class="bg-white shadow rounded-xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-semibold text-slate-700">Order Items</h2>
                <button type="button" @click="addRow()" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-sm">+ Add Product</button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead>
                    <tr class="text-left text-slate-500 border-b">
                        <th class="py-2 pr-4">Product</th>
                        <th class="py-2 pr-4 w-24">Quantity</th>
                        <th class="py-2 pr-4 w-32">Unit Cost (LKR)</th>
                        <th class="py-2 w-16"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <template x-for="(row, i) in rows" :key="i">
                        <tr class="border-b border-slate-100">
                            <td class="py-2 pr-4">
                                <select x-model.number="row.productId" :name="'productIds'"
                                        class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                                    <option value="">-- Select product --</option>
                                    <option th:each="p : ${products}" th:value="${p.id}"
                                            th:text="${p.name + ' (' + p.sku + ')'}">Product</option>
                                </select>
                            </td>
                            <td class="py-2 pr-4">
                                <input type="number" min="1" x-model.number="row.quantity" :name="'quantities'"
                                       class="w-full px-3 py-2 border border-slate-300 rounded-lg" value="1">
                            </td>
                            <td class="py-2 pr-4">
                                <input type="number" min="0" step="0.01" x-model.number="row.unitCost" :name="'unitCosts'"
                                       class="w-full px-3 py-2 border border-slate-300 rounded-lg" value="0.00">
                            </td>
                            <td class="py-2 text-right">
                                <button type="button" @click="removeRow(i)" class="text-red-500 hover:text-red-700">&#10005;</button>
                            </td>
                        </tr>
                    </template>
                    </tbody>
                </table>
            </div>
            <p x-show="rows.length === 0" class="text-sm text-slate-400 text-center py-4">No products added yet. Click "+ Add Product" to start.</p>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-6 py-2.5 rounded-lg">
                Create Purchase Order
            </button>
            <a th:href="@{/purchase-orders}" class="text-slate-500 px-4 py-2.5">Cancel</a>
        </div>
    </form>
</main>

<script>
    function poForm() {
        return {
            rows: [],
            addRow() { this.rows.push({ productId: '', quantity: 1, unitCost: 0.00 }); },
            removeRow(i) { this.rows.splice(i, 1); },
            beforeSubmit() {
                this.rows = this.rows.filter(function (row) {
                    return row.productId != null && row.productId !== '' && row.productId !== 0;
                });
            }
        };
    }
</script>
</body>
</html>
