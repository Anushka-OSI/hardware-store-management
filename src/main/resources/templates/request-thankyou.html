<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Request Submitted')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: publicNav}"></nav>

<main class="max-w-xl mx-auto px-4 py-12">
    <div class="bg-white shadow rounded-xl p-8 text-center">
        <div class="text-5xl mb-4 text-green-600">&#10004;</div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Request Submitted Successfully!</h1>
        <p class="text-slate-500 mb-6">Please save your Request ID below to check the status later.</p>

        <div class="bg-amber-50 border-2 border-dashed border-amber-400 rounded-xl p-6 mb-6">
            <div class="text-xs uppercase tracking-wide text-slate-500 mb-1">Your unique Request ID</div>
            <div class="text-3xl font-mono font-bold text-slate-800" th:text="${requestId}">REQ-XXXXXX</div>
        </div>

        <a th:href="@{/request/status}" class="inline-block bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-6 py-2.5 rounded-lg transition">
            Check Request Status
        </a>
    </div>
</main>
</body>
</html>
