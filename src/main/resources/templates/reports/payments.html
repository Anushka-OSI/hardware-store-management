<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Payment Report')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: appNav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Payment Method Breakdown</h1>
            <p class="text-slate-500 text-sm">Sales totals per payment method across a date range.</p>
        </div>
        <form method="get" th:action="@{/reports/payments}" class="flex gap-2 items-end">
            <div>
                <label class="block text-xs text-slate-500 mb-1">From</label>
                <input type="date" name="from" th:value="${#temporals.format(start, 'yyyy-MM-dd')}" class="px-3 py-2 border border-slate-300 rounded-lg">
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">To</label>
                <input type="date" name="to" th:value="${#temporals.format(end, 'yyyy-MM-dd')}" class="px-3 py-2 border border-slate-300 rounded-lg">
            </div>
            <button class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg">Show</button>
        </form>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
        <div class="bg-white shadow rounded-xl p-4 border-l-4 border-blue-500">
            <div class="text-sm text-slate-500">Transactions</div>
            <div class="text-lg font-bold" th:text="${transactions}">0</div>
        </div>
        <div class="bg-white shadow rounded-xl p-4 border-l-4 border-green-500">
            <div class="text-sm text-slate-500">Total Sales</div>
            <div class="text-lg font-bold text-green-700">LKR <span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></div>
        </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-6">
        <div class="bg-white shadow rounded-xl p-5">
            <h2 class="font-semibold text-slate-700 mb-4">Chart</h2>
            <canvas id="paymentChart" height="280"></canvas>
        </div>
        <div class="bg-white shadow rounded-xl p-5">
            <h2 class="font-semibold text-slate-700 mb-4">Per Method</h2>
            <table class="w-full text-sm">
                <thead>
                <tr class="text-left text-slate-500 border-b">
                    <th class="py-2">Method</th>
                    <th class="py-2 text-right">Transactions</th>
                    <th class="py-2 text-right">Total</th>
                    <th class="py-2 text-right">Share</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${payments}" class="border-b border-slate-100">
                    <td class="py-2 font-medium" th:text="${entry.key}">method</td>
                    <td class="py-2 text-right" th:text="${counts[entry.key] != null ? counts[entry.key] : 0}">0</td>
                    <td class="py-2 text-right">LKR <span th:text="${#numbers.formatDecimal(entry.value, 1, 2)}">0.00</span></td>
                    <td class="py-2 text-right font-semibold text-green-700" th:text="${total.signum() != 0 ? #numbers.formatDecimal(entry.value / total * 100, 1, 1) + '%' : '0%'}">%</td>
                </tr>
                <tr th:if="${#maps.isEmpty(payments)}"><td colspan="4" class="py-3 text-slate-400 text-center">No payments in this range.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    function px() {
        return [
            <th:block th:each="entry : ${payments}">'<th:text="${entry.key}">method</th:text>',</th:block>
        ];
    }
    function pv() {
        return [
            <th:block th:each="entry : ${payments}">${entry.value},</th:block>
        ];
    }
    const ctx = document.getElementById('paymentChart');
    if (ctx) {
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: px(),
                datasets: [{
                    data: pv(),
                    backgroundColor: ['#f59e0b', '#3b82f6', '#10b981'],
                    borderWidth: 2
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
    }
</script>
</body>
</html>
