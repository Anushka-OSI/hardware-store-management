<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Check Request Status')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: publicNav}"></nav>

<main class="max-w-xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Check Request Status</h1>
    <p class="text-slate-500 mb-6">Enter the Request ID you received when you submitted your request.</p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="bg-white shadow rounded-xl p-6 mb-6">
        <form th:action="@{/request/check}" method="post" class="flex gap-2">
            <input type="text" name="requestId" th:value="${lastChecked}" placeholder="e.g. REQ-1A2B3C4D" required
                   class="flex-1 px-3 py-2 border border-slate-300 rounded-lg font-mono uppercase focus:outline-none focus:ring-2 focus:ring-amber-500">
            <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-5 py-2 rounded-lg">Check</button>
        </form>
    </div>

    <!-- Result -->
    <div th:if="${request != null}" class="bg-white shadow rounded-xl p-6">
        <div class="flex justify-between items-start mb-4">
            <div>
                <div class="text-sm text-slate-500">Request ID</div>
                <div class="font-mono font-bold text-lg text-slate-800" th:text="${request.requestId}">REQ</div>
            </div>
            <span th:text="${request.status}" th:classappend="${request.status.name() == 'RESOLVED' || request.status.name() == 'CLOSED'} ? 'bg-green-100 text-green-800' : (${request.status.name() == 'IN_PROGRESS'} ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800')"
                  class="px-3 py-1 rounded-full text-xs font-bold uppercase">Status</span>
        </div>

        <div class="grid sm:grid-cols-2 gap-4 mb-4">
            <div>
                <div class="text-xs text-slate-500">Customer</div>
                <div class="text-slate-800" th:text="${request.customerName}">Name</div>
            </div>
            <div>
                <div class="text-xs text-slate-500">Telephone</div>
                <div class="text-slate-800" th:text="${request.customerPhone}">Phone</div>
            </div>
        </div>
        <div class="mb-4">
            <div class="text-xs text-slate-500">Your Message</div>
            <p class="text-slate-700 bg-slate-50 rounded-lg p-3" th:text="${request.message}">Message</p>
        </div>
        <div>
            <div class="text-xs text-slate-500">Admin Response</div>
            <p th:if="${request.adminResponse != null && !request.adminResponse.isBlank()}"
               class="text-slate-700 bg-green-50 border border-green-200 rounded-lg p-3" th:text="${request.adminResponse}">Response</p>
            <p th:unless="${request.adminResponse != null && !request.adminResponse.isBlank()}"
               class="text-slate-400 bg-slate-50 rounded-lg p-3 italic">No response yet. We will get back to you soon.</p>
        </div>
    </div>
</main>
</body>
</html>
